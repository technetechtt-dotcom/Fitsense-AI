name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web-and-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --include=dev
      - run: npm run format:check
      - run: npm run validate:catalogue-feed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:web
      - run: npm run build:all

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitsense
          POSTGRES_PASSWORD: fitsense
          POSTGRES_DB: fitsense_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitsense -d fitsense_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fitsense:fitsense@localhost:5432/fitsense_ci
      DATABASE_SSL: "false"
      AUTH_SECRET: ci-auth-secret-at-least-32-characters!!
      HANDOFF_SECRET: ci-handoff-secret-at-least-32-chars!!
      WEBHOOK_SEAL_SECRET: ci-webhook-seal-secret-at-least-32!!
      HANDOFF_STORE: postgres
      SYNC_STORE: postgres
      SKIP_AUTH: "false"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install (Render-parity lockfile install)
        run: npm ci --include=dev
      - name: Typecheck, tests (Postgres handoff/sync/migrations), build
        run: npm run check
      - run: docker build -t fitsense-api:test .

  render-api-build:
    name: render-api-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Reproduce Render: production NODE_ENV during install/build.
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Render-parity build
        run: |
          node -v
          npm -v
          npm ci --include=dev
          npm run build
      - name: Assert tsc output exists
        run: test -f dist/index.js

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Compile Android debug APK and run JVM unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:test --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source=/repo --verbose --redact || true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend production dependency audit
        working-directory: backend
        run: npm ci --omit=dev && npm audit --omit=dev --audit-level=high
      - name: Root full audit (report)
        run: npm ci --include=dev && npm audit --audit-level=high
        continue-on-error: true
      - name: Backend SBOM (CycloneDX)
        working-directory: backend
        run: |
          npm sbom --package-lock-only --omit=dev --sbom-format cyclonedx > sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: backend-sbom
          path: backend/sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Build API image
        working-directory: backend
        run: docker build -t fitsense-api:scan .
      - name: Trivy image scan (CRITICAL app libraries)
        working-directory: backend
        continue-on-error: true
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --pkg-types library --exit-code 1 --severity CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore \
            --format json --output trivy-critical.json fitsense-api:scan
          trivy image --pkg-types library --severity CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore fitsense-api:scan
      - name: Upload Trivy security report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-security-report
          path: backend/trivy-critical.json
          if-no-files-found: warn
          retention-days: 90

  staging-smoke:
    name: staging-smoke
    runs-on: ubuntu-latest
    # Requires a live staging API (not production) and an explicit enable flag.
    if: ${{ vars.STAGING_API_BASE_URL != '' && vars.STAGING_SMOKE_ENABLED == 'true' }}
    needs: [backend]
    defaults:
      run:
        working-directory: backend
    env:
      STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
      STAGING_SMOKE_RECORD: ${{ github.workspace }}/staging-smoke-record.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --include=dev
      - name: Run staging smoke (health, auth, sync, handoff)
        run: npm run staging:smoke
      - name: Upload staging smoke record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-smoke-record
          path: staging-smoke-record.json
          if-no-files-found: warn
          retention-days: 30

services:
  # ---------------------------------------------------------------------------
  # Production
  # ---------------------------------------------------------------------------
  - type: web
    name: fitsense-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: node -v && npm -v && npm ci --include=dev && npm run build
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SYNC_STORE
        value: postgres
      - key: HANDOFF_STORE
        value: postgres
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: HANDOFF_SECRET
        sync: false
      - key: WEBHOOK_SEAL_SECRET
        sync: false
      - key: WEBHOOK_SEAL_KEY_VERSION
        value: "v1"
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: WEBAUTHN_ORIGIN
        sync: false
      - key: RETENTION_SCAN_DAYS
        value: "730"
      - key: RETENTION_EVENT_DAYS
        value: "730"
      - key: RETENTION_PROFILE_DAYS
        value: "730"
      - key: RETENTION_OUTCOME_DAYS
        value: "730"

  - type: web
    name: fitsense-web
    runtime: static
    buildCommand: node -v && npm -v && npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        fromService:
          name: fitsense-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_ENABLE_DEMO_SCAN
        value: "false"
      - key: VITE_PRIVACY_CONTROLLER_NAME
        value: FitSense AI
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---------------------------------------------------------------------------
  # Staging (dedicated Neon DB + secrets — never share prod DATABASE_URL)
  # Neon staging project: snowy-truth-81855391 — NOT production weathered-mud-13816950
  # ---------------------------------------------------------------------------
  - type: web
    name: fitsense-api-staging
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: node -v && npm -v && npm ci --include=dev && npm run build
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SYNC_STORE
        value: postgres
      - key: HANDOFF_STORE
        value: postgres
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: HANDOFF_SECRET
        sync: false
      - key: WEBHOOK_SEAL_SECRET
        sync: false
      - key: WEBHOOK_SEAL_KEY_VERSION
        value: "v1"
      - key: WEBAUTHN_RP_ID
        sync: false
      - key: WEBAUTHN_ORIGIN
        sync: false
      - key: WEBAUTHN_RP_NAME
        value: FitSense Staging
      - key: RETENTION_SCAN_DAYS
        value: "730"
      - key: RETENTION_EVENT_DAYS
        value: "730"
      - key: RETENTION_PROFILE_DAYS
        value: "730"
      - key: RETENTION_OUTCOME_DAYS
        value: "730"

  - type: web
    name: fitsense-web-staging
    runtime: static
    buildCommand: node -v && npm -v && npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        fromService:
          name: fitsense-api-staging
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_ENABLE_DEMO_SCAN
        value: "false"
      - key: VITE_PRIVACY_CONTROLLER_NAME
        value: FitSense AI (Staging)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: cron
    name: fitsense-retention-staging
    runtime: node
    rootDir: backend
    plan: starter
    schedule: "0 3 * * *"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run retention:run
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          name: fitsense-api-staging
          type: web
          envVarKey: DATABASE_URL
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: AUTH_SECRET
        fromService:
          name: fitsense-api-staging
          type: web
          envVarKey: AUTH_SECRET
      - key: HANDOFF_SECRET
        fromService:
          name: fitsense-api-staging
          type: web
          envVarKey: HANDOFF_SECRET
      - key: WEBHOOK_SEAL_SECRET
        fromService:
          name: fitsense-api-staging
          type: web
          envVarKey: WEBHOOK_SEAL_SECRET

  - type: cron
    name: fitsense-webhooks-staging
    runtime: node
    rootDir: backend
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run webhooks:process
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          name: fitsense-api-staging
          type: web
          envVarKey: DATABASE_URL
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: AUTH_SECRET
        fromService:
          name: fitsense-api-staging
          type: web
          envVarKey: AUTH_SECRET
      - key: HANDOFF_SECRET
        fromService:
          name: fitsense-api-staging
          type: web
          envVarKey: HANDOFF_SECRET
      - key: WEBHOOK_SEAL_SECRET
        fromService:
          name: fitsense-api-staging
          type: web
          envVarKey: WEBHOOK_SEAL_SECRET

  - type: cron
    name: fitsense-reservations-staging
    runtime: node
    rootDir: backend
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run reservations:expire
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          name: fitsense-api-staging
          type: web
          envVarKey: DATABASE_URL
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: AUTH_SECRET
        fromService:
          name: fitsense-api-staging
          type: web
          envVarKey: AUTH_SECRET
      - key: HANDOFF_SECRET
        fromService:
          name: fitsense-api-staging
          type: web
          envVarKey: HANDOFF_SECRET
      - key: WEBHOOK_SEAL_SECRET
        fromService:
          name: fitsense-api-staging
          type: web
          envVarKey: WEBHOOK_SEAL_SECRET

  - type: cron
    name: fitsense-retention
    runtime: node
    rootDir: backend
    plan: starter
    schedule: "30 3 * * *"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run retention:run
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          name: fitsense-api
          type: web
          envVarKey: DATABASE_URL
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: AUTH_SECRET
        fromService:
          name: fitsense-api
          type: web
          envVarKey: AUTH_SECRET
      - key: HANDOFF_SECRET
        fromService:
          name: fitsense-api
          type: web
          envVarKey: HANDOFF_SECRET
      - key: WEBHOOK_SEAL_SECRET
        fromService:
          name: fitsense-api
          type: web
          envVarKey: WEBHOOK_SEAL_SECRET

  - type: cron
    name: fitsense-webhooks
    runtime: node
    rootDir: backend
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run webhooks:process
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          name: fitsense-api
          type: web
          envVarKey: DATABASE_URL
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: AUTH_SECRET
        fromService:
          name: fitsense-api
          type: web
          envVarKey: AUTH_SECRET
      - key: HANDOFF_SECRET
        fromService:
          name: fitsense-api
          type: web
          envVarKey: HANDOFF_SECRET
      - key: WEBHOOK_SEAL_SECRET
        fromService:
          name: fitsense-api
          type: web
          envVarKey: WEBHOOK_SEAL_SECRET
